[project]
name = "engine"
version = "0.1.0"
description = "Reproducible rare-disease variant engine: ingest, retrieve, filter, rank, reason, benchmark."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.5.0",
    "click>=8.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
engine = "engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
